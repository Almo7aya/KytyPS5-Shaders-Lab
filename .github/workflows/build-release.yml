name: Build and release

on:
  workflow_dispatch:
    inputs:
      kyty_repository:
        description: 'Kyty repository (owner/repository); releases require official KytyPS5/KytyPS5 and Shader Lab main'
        required: true
        default: KytyPS5/KytyPS5
        type: string
      kyty_ref:
        description: 'Branch, tag or commit; leave blank for the latest default-branch commit'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve compiler source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      repository: ${{ steps.source.outputs.repository }}
      revision: ${{ steps.source.outputs.revision }}
      official: ${{ steps.source.outputs.official }}
    steps:
      - name: Resolve requested repository and ref to one immutable commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          KYTY_REPOSITORY: ${{ inputs.kyty_repository }}
          KYTY_REF: ${{ inputs.kyty_ref }}
          SHADER_LAB_REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$KYTY_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo 'Expected a public GitHub repository in owner/repository form.' >&2
            exit 1
          fi
          info=$(gh api "repos/$KYTY_REPOSITORY")
          if [[ $(jq -r '.private' <<< "$info") != false ]]; then
            echo 'Only public compiler repositories are supported.' >&2
            exit 1
          fi
          repository=$(jq -r '.full_name' <<< "$info")
          ref="$KYTY_REF"
          if [[ -z "$ref" ]]; then ref=$(jq -r '.default_branch' <<< "$info"); fi
          encoded_ref=$(jq -rn --arg ref "$ref" '$ref | @uri')
          revision=$(gh api "repos/$repository/commits/$encoded_ref" --jq '.sha')
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
          official=false
          if [[ "${repository,,}" == kytyps5/kytyps5 ]]; then official=true; fi
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "official=$official" >> "$GITHUB_OUTPUT"
          echo "Compiler: $repository at $revision" >> "$GITHUB_STEP_SUMMARY"
          publish=false
          if [[ "$official" == true && "$SHADER_LAB_REF" == refs/heads/main ]]; then publish=true; fi
          echo "Shader Lab ref: $SHADER_LAB_REF" >> "$GITHUB_STEP_SUMMARY"
          echo "Publish release after successful tests: $publish (requires official compiler and Shader Lab main)" >> "$GITHUB_STEP_SUMMARY"

  linux:
    name: Linux extraction and report tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Configure standalone build
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Cross-check independent integer fixture encoding
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v llvm-mc-18 >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y llvm-18
          fi
          expected=$(sed -n 's@^// EXPECTED: @@p' tests/integer-buffer.s | tr -d ' \r\n')
          actual=$(llvm-mc-18 -triple=amdgcn -mcpu=gfx1030 -show-encoding tests/integer-buffer.s |
            sed -n 's/.*encoding: \[\(.*\)\].*/\1/p' | sed 's/0x//g' | tr -d ', \r\n')
          if [[ -z "$expected" || "$actual" != "$expected" ]]; then
            echo "Integer fixture encoding differs from LLVM's GFX10.3 assembler" >&2
            echo "Expected: $expected" >&2
            echo "Actual:   $actual" >&2
            exit 1
          fi
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    name: Windows x64 with Kyty worker
    needs: [resolve, linux]
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check out resolved KytyPS5 sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ needs.resolve.outputs.repository }}
          ref: ${{ needs.resolve.outputs.revision }}
          path: _Build/KytyPS5
          submodules: recursive
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
      - name: Identify shader build-tool cache
        id: vcpkg
        run: |
          $vcpkgRoot = Split-Path (Get-Command vcpkg).Source
          $revision = git -C $vcpkgRoot rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot identify hosted vcpkg revision' }
          "root=$vcpkgRoot" >> $env:GITHUB_OUTPUT
          "revision=$revision" >> $env:GITHUB_OUTPUT
      - name: Restore shader build tools
        id: shader-tools
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.vcpkg.outputs.root }}/installed/x64-windows
          key: glslang-windows-2022-x64-${{ steps.vcpkg.outputs.revision }}-tools-opt-v1
      - name: Install shader build tools
        env:
          TOOLS_CACHE_HIT: ${{ steps.shader-tools.outputs.cache-hit }}
        run: |
          $vcpkgRoot = Split-Path (Get-Command vcpkg).Source
          if ($env:TOOLS_CACHE_HIT -ne 'true') {
            vcpkg install 'glslang[tools,opt]:x64-windows'
            if ($LASTEXITCODE -ne 0) { throw 'glslang installation failed' }
          }
          & "$vcpkgRoot/installed/x64-windows/tools/glslang/glslangValidator.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'glslang tool validation failed' }
          "$vcpkgRoot/installed/x64-windows/tools/glslang" >> $env:GITHUB_PATH
      # Save before executing any selected compiler fork's CMake/build code.
      # Do not cache arbitrary post-build mutations of the tool installation.
      - name: Save shader build tools
        if: steps.shader-tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.vcpkg.outputs.root }}/installed/x64-windows
          key: ${{ steps.shader-tools.outputs.cache-primary-key }}
      - name: Configure source-linked build
        run: >-
          cmake -S . -B build-release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl
          -DCMAKE_C_COMPILER_LAUNCHER= -DCMAKE_CXX_COMPILER_LAUNCHER=
          -DKYTY_ROOT="${{ github.workspace }}/_Build/KytyPS5"
          -DSHADER_LAB_BUILD_KYTY_WORKER=ON
      - name: Build scanner, worker and tests
        run: cmake --build build-release --target shader-lab shader-kyty-worker shader-cpu-reference shader-vulkan-replay shader-lab-tests --parallel 2
      - name: Test including real compiler integration
        run: |
          # This modifies only the disposable hosted runner, not users' machines.
          Set-ItemProperty -LiteralPath 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled -Value 1
          ctest --test-dir build-release -R '^shader_lab_' --output-on-failure
      - name: Package binaries, notices and corresponding sources
        env:
          KYTY_REPOSITORY: ${{ needs.resolve.outputs.repository }}
        run: ./scripts/package-windows.ps1 -BuildDirectory build-release -KytyRoot _Build/KytyPS5 -OutputDirectory _Build/artifacts -KytyRepository $env:KYTY_REPOSITORY
      - name: Save release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x64-release
          path: _Build/artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Save test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-test-logs
          path: build-release/Testing/Temporary/*.log
          if-no-files-found: ignore

  vulkan:
    name: Linux software Vulkan replay
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ needs.resolve.outputs.repository }}
          ref: ${{ needs.resolve.outputs.revision }}
          path: _Build/KytyPS5
          submodules: recursive
          persist-credentials: false
      - name: Install build and software Vulkan dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes clang lld glslang-tools pkg-config \
            libasound2-dev libdbus-1-dev libgl1-mesa-dev libpulse-dev libudev-dev \
            libwayland-dev libx11-dev libxcursor-dev libxext-dev libxfixes-dev libxi-dev \
            libxkbcommon-dev libxrandr-dev libxss-dev libxtst-dev wayland-protocols \
            mesa-vulkan-drivers libvulkan1 vulkan-tools vulkan-validationlayers
      - name: Configure and build real compiler and replay backend
        run: |
          cmake -S . -B build-vulkan -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER= -DCMAKE_CXX_COMPILER_LAUNCHER= \
            -DKYTY_ROOT="$GITHUB_WORKSPACE/_Build/KytyPS5" -DSHADER_LAB_BUILD_KYTY_WORKER=ON
          cmake --build build-vulkan --target shader-lab-tests shader-vulkan-replay shader-kyty-worker --parallel 2
      - name: Execute real Vulkan golden fixtures on the hosted software device
        run: |
          set -euo pipefail
          icd=$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)
          test -n "$icd"
          export VK_ICD_FILENAMES="$icd"
          export VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation
          export XDG_RUNTIME_DIR="$RUNNER_TEMP"
          vulkaninfo --summary
          ctest --test-dir build-vulkan -R '^shader_lab_' --output-on-failure
          build-vulkan/shader-lab-tests --vulkan-worker "$GITHUB_WORKSPACE/build-vulkan/shader-vulkan-replay" 2>&1 | tee build-vulkan/vulkan-fixtures.log
      - name: Save software replay diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: software-vulkan-diagnostics
          path: |
            build-vulkan/vulkan-fixtures.log
            build-vulkan/Testing/Temporary/*.log
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Publish official main build
    if: needs.resolve.outputs.official == 'true' && github.ref == 'refs/heads/main'
    needs: [resolve, linux, windows, vulkan]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-x64-release
          path: artifacts
      - name: Verify bundle and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: build-${{ github.run_number }}-${{ github.run_attempt }}
          PROJECT_REVISION: ${{ github.sha }}
          KYTY_REVISION: ${{ needs.resolve.outputs.revision }}
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum --check SHA256SUMS
          # A unique tag per run/attempt prevents overwriting previous releases.
          gh release create "$RELEASE_TAG" ./* --target "$PROJECT_REVISION" \
            --title "Shader Lab $RELEASE_TAG (Kyty ${KYTY_REVISION:0:12})" \
            --notes "Official KytyPS5/KytyPS5 compiler commit: $KYTY_REVISION. Shader Lab commit: $PROJECT_REVISION. Synthetic integration and software Vulkan fixture tests passed; general shader equivalence and physical-hardware conformance are not established. See BUILD-INFO.json and the corresponding source archives for provenance."
